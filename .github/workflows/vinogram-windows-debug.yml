name: vinoGram Windows Debug

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinogram-debug-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  PYTHONUTF8: '1'

jobs:
  debug:
    name: Debug client
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: TBuild/vinoGram
          persist-credentials: false
      - uses: ./TBuild/vinoGram/.github/actions/vinogram-windows-env
        with:
          submodules: 'true'
      - uses: ./TBuild/vinoGram/.github/actions/vinogram-dependencies
        with:
          group: foundation
          restore-only: 'true'
      - uses: ./TBuild/vinoGram/.github/actions/vinogram-dependencies
        with:
          group: qt
          restore-only: 'true'
      - uses: ./TBuild/vinoGram/.github/actions/vinogram-dependencies
        with:
          group: engine
          restore-only: 'true'
      - name: Test avatar service
        shell: pwsh
        run: python C:/TBuild/vinoGram/tools/avatar-service/test_server.py
      - name: Build and package Debug
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: python C:/TBuild/vinoGram/tools/build/windows/debug_ci.py
      - name: Upload portable Debug client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vinoGram-debug-windows-x64-${{ github.sha }}
          path: C:/TBuild/vinoGram/out/debug-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
